name: Price alerts (hourly)

# Telegram when gold reaches the day's Max Pain / Call Wall / Put Wall / Gamma Flip - works with
# the PC off. Levels come from the private Google Sheet the main PC syncs; state lives in its
# "Alerts" tab. Read-only on the repo: nothing is committed. Needs repository secrets
# GOOGLE_SERVICE_ACCOUNT_JSON, GOOGLE_SHEET_ID, MAXPAIN_TELEGRAM_TOKEN, MAXPAIN_TELEGRAM_CHAT_ID
# (README "แจ้งเตือนราคาระหว่างวัน").
on:
  schedule:
    - cron: "5 * * * 1-5"      # hourly, Mon-Fri UTC
    - cron: "5 22,23 * * 0"    # Sunday-evening reopen (UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: price-alerts
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt   # sheets_sync imports the workbook code; no browser needed
      - name: Check prices against the logged levels
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          MAXPAIN_TELEGRAM_TOKEN: ${{ secrets.MAXPAIN_TELEGRAM_TOKEN }}
          MAXPAIN_TELEGRAM_CHAT_ID: ${{ secrets.MAXPAIN_TELEGRAM_CHAT_ID }}
        run: python price_alerts.py
